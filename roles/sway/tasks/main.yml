---
- name: install i3status-rust copr repo
  community.general.copr:
    name: alternateved/i3status-rust
  become: yes

- name: Install packages
  package:
    name:
      - kanshi
      - dunst
      - slurp
      - sway
      - swaybg
      - swayidle
      - swaylock
      - xdg-desktop-portal-wlr
      - brigtnessctl
      # for the swaybar
      - i3status-rust
    state: present
  become: yes

- name: Install pip3 package
  pip:
    name:
      - pulsemixer
    executable: pip3
    extra_args: --user
